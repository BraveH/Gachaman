plugins {
	id 'java'
}

repositories {
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.gachaman.GachamanPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation 'junit:junit:4.13.2'
	testCompileOnly 'org.projectlombok:lombok:1.18.30'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

group = 'com.gachaman'
version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea", "-Xmx768m"
	args "--developer-mode", "--debug"
}

tasks.register('iconArt', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.gachaman.tools.IconArt'
}

tasks.register('attackAnims', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.gachaman.tools.AttackAnims'
}

tasks.register('ceremonyArt', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.gachaman.overlay.CeremonyArt'
	args 'src/main/resources/com/gachaman/art/ceremony'
}

tasks.register('ceremonyFitCmp', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.gachaman.overlay.CeremonyFitCmp'
	args System.getProperty('out', 'build/fitcmp')
}
