# Blank issues stay on: ideas, balance arguments and questions are all welcome
# and none of them fit a bug form.
blank_issues_enabled: true
contact_links:
  - name: A quest monster is blocked and you want to keep playing right now
    url: https://github.com/BraveH/Gachaman#when-a-quest-monster-is-blocked
    about: >
      ::gachaunlock <monster name> lets you attack it until you close the client. Please still
      report it afterwards — that only gets you moving, it doesn't fix it.
  - name: How the gamemode works
    url: https://github.com/BraveH/Gachaman#readme
    about: The full rules, also in the plugin's own Help tab.
