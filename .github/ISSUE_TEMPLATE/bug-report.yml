name: Something's broken
description: Report anything in Gachaman behaving wrongly
title: "[Bug] <what went wrong>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time.

        If the problem is **a quest telling you to kill something and Gachaman not letting you**,
        go back and pick *A quest monster won't let me attack it* instead — that one asks the
        questions that get it sorted fastest.

        Don't worry about filling in every box. A half-filled report is far better than none.

  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      description: What you were doing, what you expected, and what happened instead.
      placeholder: |
        I was...
        I expected...
        Instead...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      description: >
        Step by step, as best you can. If it only happens now and then, say so and describe the
        last time you saw it — that's still worth reporting.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: persists
    attributes:
      label: Is it still wrong after you restart the client?
      options:
        - "Yes, it's still wrong"
        - "No, restarting fixed it"
        - "Haven't tried"
        - "Doesn't apply"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Which version of Gachaman?
      description: If you know it. It's on the plugin's page in the Plugin Hub.
      placeholder: "1.0.0"
    validations:
      required: false

  - type: input
    id: runelite
    attributes:
      label: Which version of RuneLite?
      description: Bottom of the RuneLite settings panel, if you can find it.
      placeholder: "1.12.35"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: What are you playing on?
      options:
        - Windows
        - Mac
        - Linux
        - Something else
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Did you see an error message?
      description: >
        If something popped up, paste it here. If you're comfortable digging out RuneLite's log
        file, anything from around the time it went wrong helps too. If none of that means much to
        you, skip this — the report is still useful without it.
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots welcome.
    validations:
      required: false
