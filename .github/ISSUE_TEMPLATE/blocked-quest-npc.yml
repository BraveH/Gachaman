name: A quest monster won't let me attack it
description: Gachaman is blocking something your quest needs you to kill
title: "[Quest] <monster> during <quest>"
labels: ["bug", "quest-exemption"]
body:
  - type: markdown
    attributes:
      value: |
        Gachaman is supposed to get out of your way during quests — anything a quest needs you to
        kill should be attackable, whatever style you rolled, with no penalties. If it isn't, that's
        our mistake, not something you did wrong.

        **You don't have to wait for a fix to carry on.** Type this in game:

        ```
        ::gachaunlock Lesser demon
        ```

        Use the monster's name. That lets you attack it until you close the client.
        `::gacharelock Lesser demon` puts it back, and `::gacharelock` on its own clears the lot.
        Anything you've unlocked is listed at the bottom of the Overview tab, so you can always see
        what you've left on.

        Then fill this in, and we'll get it fixed properly for everyone.

  - type: input
    id: npc
    attributes:
      label: What is the monster called?
      description: >
        Exactly as it appears when you right-click it — spelling and capital letters included. Leave
        off the level and anything after it.
      placeholder: Lesser demon
    validations:
      required: true

  - type: input
    id: quest
    attributes:
      label: Which quest needs you to kill it?
      placeholder: Dragon Slayer I
    validations:
      required: true

  - type: dropdown
    id: when
    attributes:
      label: Could you attack it earlier in the same quest?
      description: >
        If it worked before and then stopped, that's a different problem from it never working at
        all — knowing which saves us a lot of guessing.
      options:
        - "No — it's been blocked the whole quest"
        - "Yes — it worked earlier, then stopped"
        - "Can't remember"
    validations:
      required: true

  - type: textarea
    id: step
    attributes:
      label: Where were you up to?
      description: Roughly what the quest had just asked you to do, and where you were.
      placeholder: |
        In Melzar's Maze looking for the first map piece. The lesser demon at the bottom
        had no Attack option when I right-clicked it.
    validations:
      required: true

  - type: dropdown
    id: workaround
    attributes:
      label: Did `::gachaunlock` get you moving again?
      description: If it didn't, something else is going on, and that's worth knowing.
      options:
        - "Yes"
        - "No"
        - "Haven't tried it"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Which version of Gachaman?
      description: If you know it. It's on the plugin's page in the Plugin Hub.
      placeholder: "1.0.0"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: A screenshot of the right-click menu is handy if you have one.
    validations:
      required: false
